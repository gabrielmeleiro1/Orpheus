name: Source validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements/base.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate base setup plan
        run: python scripts/setup_runtime.py --profile base --dry-run --json

      - name: Check Python sources
        run: python -m ruff check .

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test Python contract
        run: python run_tests.py --contract

      - name: Check desktop types
        working-directory: desktop
        run: npm run typecheck

      - name: Test desktop frontend
        working-directory: desktop
        run: npm test -- --run

      - name: Test Tauri shell
        working-directory: desktop/src-tauri
        run: cargo test --locked -- --test-threads=1

      - name: Check Tauri shell
        working-directory: desktop/src-tauri
        run: cargo check --locked
