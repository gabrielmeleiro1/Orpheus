name: Validation

on:
  pull_request:
  push:
    branches:
      - main
      - ci/validation-workflow

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system dependencies
        run: brew install ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run contract tests
        run: |
          python -m pytest tests \
            -m "not property and not benchmark and not slow and not ui" \
            -k "not test_memory_error_degrades_to_sequential and not test_orchestrator_creates_and_shuts_down_owned_manager and not test_conversion_service_repair_cancelled_chapter_result_finishes_cancelled"

  desktop:
    name: Desktop
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck frontend
        working-directory: desktop
        run: npm run typecheck

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Prepare Tauri resource directories
        working-directory: desktop/src-tauri
        run: mkdir -p binaries

      - name: Test Tauri shell
        working-directory: desktop/src-tauri
        run: cargo test -- --skip build_dev_launch_config_matches_desktop_runtime_contract

      - name: Check Tauri shell
        working-directory: desktop/src-tauri
        run: cargo check
