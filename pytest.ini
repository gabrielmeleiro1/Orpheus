[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=modules
    --cov-report=term-missing
    --cov-report=html:.artifacts/coverage/html
    --cov-report=xml:.artifacts/coverage/coverage.xml
    # Ratchet: keep this just under actual coverage (about 88%) so a real regression
    # trips it.
    --cov-fail-under=85

# Markers for test categorization
markers =
    # Test types
    integration: Integration tests (slower, test interactions)
    property: Property-based tests (fuzz testing with hypothesis)
    benchmark: Performance benchmarks
    slow: Slow tests (skip with -m 'not slow')
    
    # Component markers
    tts: Text-to-Speech related tests
    audio: Audio processing tests
    pipeline: Pipeline orchestration tests
    
    # Feature markers
    mlx: Tests requiring MLX framework
    ffmpeg: Tests requiring FFmpeg
    gpu: Tests requiring GPU/Neural Engine
    memory: Memory management tests
    parallel: Parallel processing tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning:pytest.*:
    ignore::UserWarning
    error::RuntimeWarning

# Async configuration
asyncio_mode = strict

# Coverage configuration lives in .coveragerc (coverage.py does not read pytest.ini).
