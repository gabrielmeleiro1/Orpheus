target-version = "py312"
line-length = 100

# Ruff already skips .venv, venv, node_modules, dist, and tool caches by
# default, and respects .gitignore. These add local runtime and build output.
extend-exclude = [
    ".artifacts",
    ".hypothesis",
    "data",
    "desktop/src-tauri/binaries",
    "desktop/src-tauri/target",
    "htmlcov",
    "output",
    "temp",
]

[lint.per-file-ignores]
"tests/test_*.py" = ["E402"]
