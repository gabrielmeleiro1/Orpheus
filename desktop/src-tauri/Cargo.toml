[package]
name = "orpheus_desktop"
version = "1.0.0"
description = "Tauri shell for Orpheus"
authors = ["Orpheus"]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
rfd = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "~2.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# Proc macros and build scripts run on the build machine only. Stripping them
# produces dylibs that newer macOS dyld refuses to load.
[profile.release.build-override]
strip = false
