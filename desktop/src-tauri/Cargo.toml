[package]
name = "orpheus_desktop"
version = "1.0.0"
description = "Tauri shell for Orpheus"
authors = ["Orpheus"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
